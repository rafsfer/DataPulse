name: Foundation checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: datapulse
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datapulse -d datapulse"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql+psycopg://datapulse:ci-only-password@localhost:5432/datapulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "./backend[dev]"
      - run: python scripts/migrate.py
        env:
          DATABASE_URL: postgresql+psycopg://datapulse:ci-only-password@localhost:5432/datapulse
      - run: ruff check backend pipelines scripts airflow
      - run: ruff format --check backend pipelines scripts airflow
      - run: mypy --config-file backend/pyproject.toml -p app
      - run: pytest -c backend/pyproject.toml backend/tests pipelines/tests
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -f backend/Dockerfile .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
