[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.4",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.38",
  "psycopg[binary]==3.2.4",
  "pandas==2.2.3",
  "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.9.6", "mypy==1.15.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pipelines", "pipelines.*"]
follow_imports = "skip"
